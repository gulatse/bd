name: Resolve cloudnproxy nodes

on:
  schedule:
    # 每 6 小时跑一次，避开整点
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      domain:
        description: '要解析的域名'
        required: false
        default: 'cloudnproxy.n.shifen.com'
      timeout:
        description: '单次 DNS 查询超时（秒）'
        required: false
        default: '3'

permissions:
  contents: write

concurrency:
  group: resolve-cloudnproxy
  cancel-in-progress: false

jobs:
  resolve:
    name: 解析 A 记录并按地区归并
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --disable-pip-version-check --quiet dnspython requests

      - name: 解析节点
        env:
          DOMAIN: ${{ inputs.domain || 'cloudnproxy.n.shifen.com' }}
          TIMEOUT: ${{ inputs.timeout || '3' }}
        run: |
          python scripts/resolve.py \
            --domain "$DOMAIN" \
            --dns data/dns.txt \
            --out output \
            --timeout "$TIMEOUT"

      - name: 结果预览
        run: cat output/nodes.md

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cloudnproxy-nodes
          path: output/
          retention-days: 30

      - name: 提交回仓库
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update cloudnproxy nodes'
          file_pattern: 'output/*'
